name: Release

# Push a tag like v1.2.0 to build a universal app and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Support/Info.plist
          UNIVERSAL=1 ./build.sh
          lipo -archs build/CleanDisk.app/Contents/MacOS/CleanDisk

      - name: Zip
        run: ditto -c -k --keepParent build/CleanDisk.app "CleanDisk-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download `CleanDisk-${TAG}.zip` below and unzip it.
          2. Drag **CleanDisk.app** into your Applications folder.
          3. Open it. macOS will block it the first time because the app is not notarized:
             go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.

          Requires macOS 14 or later. Runs on Apple silicon and Intel.
          EOF
          sed -i '' "s/\${TAG}/${GITHUB_REF_NAME}/" notes.md
          gh release create "$GITHUB_REF_NAME" "CleanDisk-${GITHUB_REF_NAME}.zip" \
            --title "CleanDisk ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
